# ─────────────────────────────────────────────────────────────
# Single Compose file — DEVELOPMENT by default.
#
#   docker compose up            → dev stack: source is bind-mounted and the
#                                  dev servers watch files, so edits to frontend
#                                  or backend code are live WITHOUT a rebuild.
#                                  Only dependency changes need `--build`.
#
# For a PRODUCTION build (built images, no mounts), set the prod build targets
# and drop the dev `command`/`volumes`:
#   backend  → build.target: prod   (and NODE_ENV=production)
#   frontend → build.target: serve  (nginx)
# ─────────────────────────────────────────────────────────────
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-stickyBoard}
    volumes:
      - mongo-data:/data/db
    ports:
      - "${MONGO_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
      args:
        BACKEND_PORT: ${BACKEND_PORT:-8081}
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-8081}
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB:-stickyBoard}
      CORS_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
      LOG_API_TRAFFIC: ${LOG_API_TRAFFIC:-true}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      RATE_LIMIT: ${RATE_LIMIT:-true}
      # AI helmet-detection — shared secret + durable snapshot dir (named volume).
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      SNAPSHOT_DIR: /app/data/snapshots
      VIOLATION_RETENTION_DAYS: ${VIOLATION_RETENTION_DAYS:-30}
      # Proxy target for the AI overlay (annotated MJPEG) shown in the camera view.
      AI_DETECTOR_URL: ${AI_DETECTOR_URL:-http://ai-detector:8090}
    # nodemon with -L (legacy/polling watch) — required for Windows bind mounts.
    command: ["npx", "nodemon", "-L", "src/routes/server.js"]
    volumes:
      - ./backend/src:/app/src
      - snapshots:/app/data/snapshots
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8081}:${BACKEND_PORT:-8081}"

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      # Vite listens on container port 80 so it matches the "8080:80" mapping.
      PORT: 80
      # The browser (on the host) calls the backend's published port directly.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8081/api/v1}
      # Enable chokidar polling so HMR works over Windows bind mounts.
      USE_POLLING: "true"
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # Helmet-violation detector (phase 1). Pulls RTSP frames from aiEnabled cameras,
  # runs YOLO, and POSTs violations back to the backend. Starts with the rest of
  # the stack (docker compose up -d). Needs AI_SERVICE_TOKEN set and a model at
  # ./ai-detector/models/helmet.pt (or MODEL_PATH=yolov8n.pt for the smoke test).
  ai-detector:
    build:
      context: ./ai-detector
    restart: unless-stopped
    environment:
      API_URL: http://backend:8081/api/v1
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      MODEL_PATH: ${MODEL_PATH:-/models/helmet.pt}
      NOHELMET_CLASSES: ${NOHELMET_CLASSES:-no-helmet,no_helmet,without helmet,nohelmet}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.5}
      VEHICLE_CONF: ${VEHICLE_CONF:-0.3}
      INFER_IMGSZ: ${INFER_IMGSZ:-960}
      SAMPLE_FPS: ${SAMPLE_FPS:-4}
      # Rider association — only flag bare heads on a motorcycle (skip pedestrians).
      REQUIRE_MOTORCYCLE: ${REQUIRE_MOTORCYCLE:-true}
      MOTO_MODEL_PATH: ${MOTO_MODEL_PATH:-}
      # Debug viewer — live annotated MJPEG at http://localhost:8090 while tuning.
      DEBUG_VIEW: ${DEBUG_VIEW:-false}
    volumes:
      - ./ai-detector/models:/models:ro
    ports:
      - "${DEBUG_PORT:-8090}:8090"
    depends_on:
      - backend

volumes:
  mongo-data:
  snapshots:
